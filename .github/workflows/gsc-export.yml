name: Export GSC Performance Data

on:
  workflow_dispatch:
    inputs:
      date:
        description: Optional export date (YYYY-MM-DD); defaults to 3 days ago
        required: false
        type: string
  schedule:
    # GSC finalized data normally lags 2–3 days. Run daily at 06:10 UTC.
    - cron: '10 6 * * *'

permissions:
  contents: read

env:
  GSC_SITE_URL: https://agentspulse.github.io/

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check 'google-auth>=2.29,<3' 'requests>=2.31,<3'

      - name: Resolve export date
        id: export-date
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            date -d "$REQUESTED_DATE" '+date=%F' >> "$GITHUB_OUTPUT"
          else
            date -u -d '3 days ago' '+date=%F' >> "$GITHUB_OUTPUT"
          fi

      - name: Export Search Console data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: >-
          python3 scripts/export_gsc_performance.py
          --date "${{ steps.export-date.outputs.date }}"
          --output-dir "tmp/gsc/${{ steps.export-date.outputs.date }}"

      - name: Upload CSV export
        uses: actions/upload-artifact@v4
        with:
          name: gsc-performance-${{ steps.export-date.outputs.date }}
          path: tmp/gsc/${{ steps.export-date.outputs.date }}/
          retention-days: 90
          if-no-files-found: error
